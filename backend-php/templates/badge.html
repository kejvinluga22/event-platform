<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'DejaVu Sans', sans-serif; color: #111; }
  .badge {
    width: 100%; height: 100%;
    padding: 14px 12px;
    text-align: center;
    border: 2px solid #EC2024;
  }
  .event { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #EC2024; }
  .name { font-size: 20px; font-weight: bold; margin: 8px 0 2px; }
  .company { font-size: 12px; color: #555; }
  .tier {
    display: inline-block; margin: 8px 0; padding: 3px 12px;
    border-radius: 12px; background: #EC2024; color: #fff;
    font-size: 11px; font-weight: bold; text-transform: uppercase;
  }
  .qr { margin-top: 6px; }
  .qr img { width: 130px; height: 130px; }
  .rid { font-size: 10px; color: #888; margin-top: 4px; }
</style>
</head>
<body>
  <div class="badge">
    <div class="event">{{Event_Title}}</div>
    <div class="name">{{First_Name}} {{Last_Name}}</div>
    <div class="company">{{Company}}</div>
    <div class="tier">{{Ticket_Type}}</div>
    <div class="qr"><img src="{{QR_DATA_URI}}" alt="QR Code"></div>
    <div class="rid">Registration #{{REG_ID}}</div>
  </div>
</body>
</html>
